<nav class="navbar navbar-expand-lg navbar-dark shadow-sm"
    style="background: rgba(0,0,0,0.55); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255,255,255,0.1);">

    <div class="container">

        <!-- Brand -->
        <a class="navbar-brand fw-bold text-warning" href="{% if user.is_authenticated %}
                {% if user.profile.role == 'admin' %}
                    {% url 'admin_dashboard' %}
                {% elif user.profile.role == 'staff' %}
                    {% url 'staff_dashboard' %}
                {% else %}
                    {% url 'student_dashboard' %}
                {% endif %}
           {% else %}
                {% url 'login' %}
           {% endif %}">

            📚 Library Management System
        </a>

        <!-- Toggle -->
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Links -->
        <div class="collapse navbar-collapse" id="navbarNav">

            <ul class="navbar-nav ms-auto align-items-center">

                {% if user.is_authenticated %}

                <li class="nav-item me-3">
                    <span class="text-light small">
                        👋 {{ request.user.username }}
                    </span>
                </li>

                <!-- HOME ROLE BASED -->
                <li class="nav-item">
                    <a class="nav-link" href="
                            {% if user.profile.role == 'admin' %}
                                {% url 'admin_dashboard' %}
                            {% elif user.profile.role == 'staff' %}
                                {% url 'staff_dashboard' %}
                            {% else %}
                                {% url 'student_dashboard' %}
                            {% endif %}
                        ">
                        <i class="fa fa-home me-1"></i> Home
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'profile' %}">
                        <i class="fa fa-user me-1"></i> Profile
                    </a>
                </li>

                {% if user.is_superuser %}
                <li class="nav-item">
                    <a class="nav-link text-warning" href="/admin">
                        <i class="fa fa-cog me-1"></i> Admin
                    </a>
                </li>
                {% endif %}

                <li class="nav-item ms-2">
                    <a class="btn btn-outline-warning btn-sm px-3" href="{% url 'logout' %}">
                        <i class="fa fa-sign-out-alt me-1"></i> Logout
                    </a>
                </li>

                {% else %}

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'login' %}">
                        <i class="fa fa-sign-in-alt me-1"></i> Login
                    </a>
                </li>

                <li class="nav-item ms-2">
                    <a class="btn btn-success btn-sm px-3" href="{% url 'select_role' %}">
                        <i class="fa fa-user-plus me-1"></i> Register
                    </a>
                </li>

                {% endif %}

            </ul>

        </div>

    </div>

</nav>
