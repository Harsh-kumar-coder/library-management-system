{% extends 'base.html' %}

{% block content %}

{% include 'includes/dashboard_navbar.html' %}

<div class="container d-flex justify-content-center align-items-center" style="min-height:75vh;">

    <div class="glass-card p-5 text-center shadow-lg" style="max-width:420px; width:100%; border-radius:22px;">

        <!-- ICON -->
        <div class="mb-3">
            <i class="fa-solid fa-circle-check fa-4x text-success"></i>
        </div>

        <!-- TITLE -->
        <h3 class="fw-bold text-white mb-2">
            Success 🎉
        </h3>

        <p class="text-light opacity-75 mb-4">
            Your password has been changed successfully
        </p>

        <!-- BUTTON -->
        <a href="{% url 'login' %}" class="btn btn-success w-100 fw-bold py-2" style="border-radius:12px;">
            🔐 Login Now
        </a>

        <!-- SMALL TEXT -->
        <p class="text-light opacity-50 mt-3 small">
            You can now login with your new password
        </p>

    </div>

</div>

{% endblock %}
