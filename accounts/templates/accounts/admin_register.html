{% extends 'base.html' %}

{% block title %}Admin Register{% endblock %}

{% block content %}

{% include 'includes/public_navbar.html' %}

<div class="login-wrapper">

    <div class="login-card">

        <!-- HEADER -->
        <div class="text-center mb-4">

            <h2 class="login-title">
                <i class="fa-solid fa-user-shield text-danger me-2"></i>
                Admin Registration
            </h2>

            <p class="login-subtitle">
                Create administrator account
            </p>

        </div>

        <form method="POST">
            {% csrf_token %}

            <!-- Username -->
            <div class="mb-3 input-group">
                <span class="input-group-text">
                    <i class="fa-solid fa-user"></i>
                </span>
                <input type="text" name="username" class="form-control" placeholder="Enter Username" required>
            </div>

            <!-- Email -->
            <div class="mb-3 input-group">
                <span class="input-group-text">
                    <i class="fa-solid fa-envelope"></i>
                </span>
                <input type="email" name="email" class="form-control" placeholder="Enter Email" required>
            </div>

            <!-- Admin Code -->
            <div class="mb-3 input-group">
                <span class="input-group-text">
                    <i class="fa-solid fa-key"></i>
                </span>

                <input type="password" id="adminCode" name="admin_code"
                       class="form-control" placeholder="Admin Secret Code" required>

                <span class="input-group-text" onclick="togglePass('adminCode')" style="cursor:pointer;">
                    <i class="fa-solid fa-eye"></i>
                </span>
            </div>

            <div class="text-center mb-3">
                <small class="text-light opacity-75">
                    Don't have Admin Code?
                    <a href="{% url 'contact' %}" class="text-warning text-decoration-none">
                        Contact Owner
                    </a>
                </small>
            </div>

            <!-- Password -->
            <div class="mb-3 input-group">
                <span class="input-group-text">
                    <i class="fa-solid fa-lock"></i>
                </span>

                <input type="password" id="adminPass" name="password"
                       class="form-control" placeholder="Enter Password" required>

                <span class="input-group-text" onclick="togglePass('adminPass')" style="cursor:pointer;">
                    <i class="fa-solid fa-eye"></i>
                </span>
            </div>

            <!-- Confirm Password -->
            <div class="mb-3 input-group">
                <span class="input-group-text">
                    <i class="fa-solid fa-lock"></i>
                </span>

                <input type="password" id="adminConfirmPass" name="confirm_password"
                       class="form-control" placeholder="Confirm Password" required>

                <span class="input-group-text" onclick="togglePass('adminConfirmPass')" style="cursor:pointer;">
                    <i class="fa-solid fa-eye"></i>
                </span>
            </div>

            <!-- TERMS -->
            <div class="form-check mb-3">
                <input class="form-check-input" type="checkbox" required>
                <label class="form-check-label text-white">
                    I agree to the
                    <a href="{% url 'terms_conditions' %}" class="text-warning" target="_blank">
                        Terms & Conditions
                    </a>
                </label>
            </div>

            <!-- BUTTON -->
            <button type="submit" class="btn btn-warning w-100 fw-bold">
                <i class="fa-solid fa-user-shield me-2"></i>
                Register Admin
            </button>

        </form>

        <hr class="text-white">

        <p class="text-center mb-0 text-white">
            Already have an account?
            <a href="{% url 'login' %}" class="text-warning text-decoration-none fw-semibold">
                <i class="fa-solid fa-right-to-bracket me-1"></i>
                Login
            </a>
        </p>

    </div>

</div>

{% endblock %}
