{% extends 'base.html' %}

{% block content %}

{% include 'includes/dashboard_navbar.html' %}

<div class="container d-flex justify-content-center align-items-center" style="min-height:75vh;">

    <div class="glass-card p-5 shadow-lg" style="max-width:450px; width:100%; border-radius:22px;">

        <!-- ICON -->
        <div class="text-center mb-3">
            <i class="fa-solid fa-lock fa-3x text-warning"></i>
        </div>

        <!-- TITLE -->
        <h3 class="text-center fw-bold text-white mb-2">
            Set New Password
        </h3>

        <p class="text-center text-light opacity-75 mb-4">
            Create a strong and secure password
        </p>

        <!-- FORM -->
        <form method="POST">
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label text-light">New Password</label>
                <input type="password"
                       name="new_password1"
                       class="form-control"
                       placeholder="Enter new password"
                       required
                       style="border-radius:12px; padding:10px;">
            </div>

            <div class="mb-3">
                <label class="form-label text-light">Confirm Password</label>
                <input type="password"
                       name="new_password2"
                       class="form-control"
                       placeholder="Confirm password"
                       required
                       style="border-radius:12px; padding:10px;">
            </div>

            {% if form.errors %}
            <div class="alert alert-danger py-2">
                {{ form.errors }}
            </div>
            {% endif %}

            <button type="submit" class="btn btn-success w-100 fw-bold py-2" style="border-radius:12px;">
                🔐 Update Password
            </button>

        </form>

    </div>

</div>

{% endblock %}
