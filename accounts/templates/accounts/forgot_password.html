{% extends 'base.html' %}

{% block title %}Forgot Password{% endblock %}

{% block content %}

{% include 'includes/public_navbar.html' %}

<div class="container d-flex justify-content-center align-items-center" style="min-height:70vh;">

    <div class="glass-card p-5 shadow-lg text-center" style="max-width:450px; width:100%; border-radius:22px;">

        <!-- ICON -->
        <div class="mb-3">
            <i class="fa-solid fa-lock-open fa-3x text-warning"></i>
        </div>

        <!-- TITLE -->
        <h3 class="fw-bold text-white mb-2">
            Forgot Password?
        </h3>

        <p class="text-light opacity-75 mb-4">
            Enter your email and we’ll send you a reset link
        </p>

        <!-- FORM -->
        <form method="POST">
            {% csrf_token %}

            <div class="mb-3 text-start">
                <label class="form-label text-light">Email Address</label>
                <input type="email"
                       name="email"
                       class="form-control"
                       placeholder="example@gmail.com"
                       required
                       style="border-radius:12px; padding:10px;">
            </div>

            <button class="btn btn-warning w-100 fw-bold py-2" style="border-radius:12px;">
                📩 Send Reset Link
            </button>

        </form>

        <!-- BACK LINK -->
        <div class="mt-3">
            <a href="{% url 'login' %}" class="text-light opacity-75 small">
                ← Back to Login
            </a>
        </div>

    </div>

</div>

{% endblock %}
