{% extends 'base.html' %}

{% block title %}Forgot Password{% endblock %}

{% block content %}

{% include 'includes/dashboard_navbar.html' %}

<div class="d-flex justify-content-center align-items-center" style="min-height:60vh;">

    <div class="card shadow-lg border-0 p-4"
         style="
         max-width:500px;
         width:100%;
         border-radius:20px;
         backdrop-filter: blur(10px);
         background: rgba(255,255,255,0.15);
         ">

        <h3 class="text-center mb-4 text-white">
            Forgot Password
        </h3>

        <form method="POST">

            {% csrf_token %}

            <input
                type="email"
                name="email"
                class="form-control"
                placeholder="Enter your email"
                required
            >

            <button class="btn btn-dark w-100 mt-3">
                Send Reset Link
            </button>

        </form>

    </div>

</div>

{% endblock %}
