{% extends 'base.html' %}

{% block content %}

{% include 'includes/dashboard_navbar.html' %}

<div class="container d-flex justify-content-center align-items-center" style="min-height:75vh;">

    <div class="glass-card p-5 text-center shadow-lg" style="max-width:450px; width:100%; border-radius:22px;">

        <!-- ICON -->
        <div class="mb-3">
            <i class="fa-solid fa-envelope-circle-check fa-4x text-primary"></i>
        </div>

        <!-- TITLE -->
        <h3 class="fw-bold text-white mb-2">
            Email Sent ✔
        </h3>

        <!-- MESSAGE -->
        <p class="text-light opacity-75 mb-4">
            We’ve sent a password reset link to your email.<br>
            Please check your inbox or spam folder.
        </p>

        <!-- EXTRA INFO -->
        <div class="alert alert-info py-2 small">
            💡 If you're in development mode, check your terminal for the reset link
        </div>

        <!-- BUTTON -->
        <a href="{% url 'login' %}" class="btn btn-dark w-100 fw-bold py-2" style="border-radius:12px;">
            ← Back to Login
        </a>

    </div>

</div>

{% endblock %}
