{% extends 'base.html' %}

{% block content %}

{% include 'includes/dashboard_navbar.html' %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-5 col-md-7">

            <div class="glass-card p-4">
                <div class="mb-3 text-center">
                    <i class="fa-solid fa-book-open fa-3x text-success"></i>
                </div>

                <div class="text-center mb-4">
                    <h3 class="text-white fw-bold">
                        Add New Book
                    </h3>
                    <p class="text-light opacity-75 small mb-0">
                        Enter book details below
                    </p>
                </div>

                <form method="POST">

                    {% csrf_token %}

                    <div class="mb-3">
                        <label class="form-label text-white">
                            Book Title
                        </label>
                        <input type="text" name="title" class="form-control" placeholder="Enter book title" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label text-white">
                            Author
                        </label>
                        <input type="text" name="author" class="form-control" placeholder="Enter author name" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label text-white">
                            ISBN
                        </label>
                        <input type="text" name="isbn" class="form-control" placeholder="Enter ISBN number" required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label text-white">
                            Quantity
                        </label>
                        <input type="number" name="quantity" min="1" class="form-control" placeholder="Available copies"
                            required>
                    </div>

                    <button type="submit" class="btn btn-success w-100 py-2">
                        <i class="fa-solid fa-book-medical me-2"></i>
                        Add Book
                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
