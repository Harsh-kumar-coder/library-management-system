{% extends 'base.html' %}

{% block title %}
Issue Book
{% endblock %}

{% block content %}
{% include 'includes/dashboard_navbar.html' %}

<div class="container py-5">

    <div class="card shadow-lg border-0 mx-auto p-4" style="max-width:600px;border-radius:20px;">

        <div class="text-center mb-4">

            <h2 class="fw-bold text-primary">
                📚 Issue Book
            </h2>

            <p class="text-muted">
                Assign a book to student
            </p>

        </div>

        <form method="POST">

            {% csrf_token %}

            <!-- STUDENT -->

            <div class="mb-3">

                <label class="form-label fw-bold">
                    Select Student
                </label>

                <select name="student" class="form-select" required>

                    <option value="">
                        Choose Student
                    </option>

                    {% for student in students %}

                    <option value="{{ student.id }}">
                        {{ student.username }}
                    </option>

                    {% endfor %}

                </select>

            </div>

            <!-- BOOK -->

            <div class="mb-3">

                <label class="form-label fw-bold">
                    Select Book
                </label>

                <select name="book" class="form-select" required>

                    <option value="">
                        Choose Book
                    </option>

                    {% for book in books %}

                    <option value="{{ book.id }}">
                        {{ book.title }}
                    </option>

                    {% endfor %}

                </select>

            </div>

            <!-- ISSUE DATE -->

            <div class="mb-3">

                <label class="form-label fw-bold">
                    Issue Date
                </label>

                <input type="date" name="issue_date" class="form-control" required>

            </div>

            <!-- BUTTON -->

            <button type="submit" class="btn btn-success w-100 py-2">

                Issue Book

            </button>

        </form>

    </div>

</div>

{% endblock %}
