{% extends 'base.html' %}

{% block title %}
Issue Book
{% endblock %}

{% block content %}

{% include 'includes/dashboard_navbar.html' %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-6 col-md-8">

            <!-- MAIN CARD -->
            <div class="glass-card p-4 p-md-5 shadow-lg">

                <!-- HEADER -->
                <div class="text-center mb-4">

                    <div class="mb-2">
                        <i class="fa-solid fa-book-open-reader fa-3x text-success"></i>
                    </div>

                    <h3 class="fw-bold text-white">
                        Issue Book
                    </h3>

                    <p class="text-light opacity-75 small">
                        Assign a book to student
                    </p>

                </div>

                <form method="POST">
                    {% csrf_token %}

                    <!-- STUDENT -->
                    <div class="mb-3">
                        <label class="form-label text-light">Select Student</label>

                        <select name="student" class="form-select"
                                style="border-radius:12px;" required>

                            <option value="">Choose Student</option>

                            {% for student in students %}
                            <option value="{{ student.id }}">
                                {{ student.username }}
                            </option>
                            {% endfor %}

                        </select>
                    </div>

                    <!-- BOOK -->
                    <div class="mb-3">
                        <label class="form-label text-light">Select Book</label>

                        <select name="book" class="form-select"
                                style="border-radius:12px;" required>

                            <option value="">Choose Book</option>

                            {% for book in books %}
                            <option value="{{ book.id }}">
                                {{ book.title }}
                            </option>
                            {% endfor %}

                        </select>
                    </div>

                    <!-- ISSUE DATE -->
                    <div class="mb-4">
                        <label class="form-label text-light">Issue Date</label>

                        <input type="date" name="issue_date"
                               class="form-control"
                               style="border-radius:12px;"
                               required>
                    </div>

                    <!-- BUTTON -->
                    <button type="submit"
                            class="btn btn-success w-100 py-2 fw-bold">
                        Issue Book
                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
